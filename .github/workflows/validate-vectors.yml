name: Validate Test Vectors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate vectors (meta-schema + per-vector)
        run: python3 scripts/validate_vectors.py --check-meta --format summary

      - name: Error-path verification
        run: python3 scripts/validate_vectors.py --check-errors --format summary

      - name: Cryptographic verification (v2 signing profile)
        run: python3 scripts/validate_vectors.py --check-crypto --format summary

      - name: Schema meta-validation + profiles catalog validation
        run: python3 scripts/check_consistency.py

      - name: Runtime-rule harness (deterministic spec algorithms)
        run: python3 scripts/runtime_harness.py

      - name: Normative example extraction + validation
        run: python3 scripts/extract_examples.py

      - name: Cross-reference link check (M-14 anchor sweep)
        run: python3 scripts/check_links.py

      - name: Generate JUnit report
        run: python3 scripts/validate_vectors.py --check-errors --format junit > vector-results.xml
        if: always()

      - name: Upload JUnit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-validation-results
          path: vector-results.xml
        if: always()
